# Claude reviews a pull request when the owner marks it "Ready for review" or labels it "claude-review".
# pull_request_target runs main's copy of this file, so the job can use the "claude" environment, whose token
# only main can read. The checkout is main, never the pull request: Claude reads the changes through GitHub and
# nothing from the branch is run or loaded here. Pull requests from forks never start it (this repository is
# public): the owner reviews those himself, and their Lint run waits for his approval.
name: Claude review

on:
  pull_request_target:
    types: [ready_for_review, labeled]

jobs:
  review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login == github.repository_owner &&
      (github.event.action == 'ready_for_review' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: claude
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token (the permissions above), not the Claude app's: the app's sign-in (an OIDC exchange)
          # answers "Invalid OIDC token" for these repositories. Comments come from github-actions[bot].
          github_token: ${{ github.token }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # default: besides reading, Claude uses only the tools --allowedTools lists. Since claude-code-action
          # 1.0.273 the default is auto mode, where a safety review can pass other tool calls too.
          claude_args: '--permission-mode default --allowedTools "mcp__github_inline_comment__create_inline_comment"'
